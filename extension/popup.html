<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cloud Computer AI.com Bridge</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div class="popup-brand">
          <img src="brand-wordmark-dark.svg" alt="Cloud Computer AI.com">
        </div>
        <h1>YouTube bridge</h1>
        <p>Viewer-local control. Starts disabled.</p>
      </header>
      <label for="target">Cloud Computer AI.com tab</label>
      <select id="target">
        <option value="">No allowed Cloud Computer AI.com tab found</option>
      </select>
      <div class="actions">
        <button id="enable" type="button">ENABLE</button>
        <button id="pause" type="button" disabled>PAUSE</button>
        <button id="stop" class="danger" type="button">STOP</button>
      </div>
      <p id="status" class="status" role="status">Loading bridge state…</p>
      <dl>
        <div><dt>Forwarded</dt><dd id="forwarded">0</dd></div>
        <div><dt>Filtered</dt><dd id="rejected">0</dd></div>
      </dl>
      <p class="hint">Only bounded slash commands are accepted. Ordinary chat stays on YouTube.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
